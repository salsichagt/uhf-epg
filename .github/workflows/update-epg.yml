name: Update EPG

on:
  schedule:
    # 04:17 Guatemala time (10:17 UTC), every day
    - cron: "17 10 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "channels.txt"
      - "build_epg.py"
      - ".github/workflows/update-epg.yml"

permissions:
  contents: write

concurrency:
  group: epg-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build filtered EPG
        run: python build_epg.py

      - name: Commit updated guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.xml epg.xml.gz status.json
          if git diff --cached --quiet; then
            echo "No EPG changes to commit."
          else
            git commit -m "Update EPG"
            git push
          fi
